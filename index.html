<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinguaBoost LEA — Apprends avec Chispa 🐲</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,700&display=swap" rel="stylesheet">
    <style>
      @keyframes float-up {
        0% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-20px); }
      }
      .animate-float-up { animation: float-up 0.8s ease-out forwards; }

      /* ---- Mascotte : animations ---- */
      @keyframes mascot-bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      .mascot-idle { animation: mascot-bob 2.6s ease-in-out infinite; }

      @keyframes mascot-hop {
        0%, 100% { transform: translateY(0) scale(1, 1); }
        20% { transform: translateY(2px) scale(1.06, 0.92); }
        45% { transform: translateY(-22px) scale(0.96, 1.06); }
        70% { transform: translateY(0) scale(1.04, 0.94); }
        85% { transform: translateY(-8px) scale(1, 1); }
      }
      .mascot-happy { animation: mascot-hop 0.9s ease-in-out infinite; transform-origin: 50% 100%; }

      @keyframes mascot-sad-sway {
        0%, 100% { transform: translateY(4px) rotate(-2deg); }
        50% { transform: translateY(6px) rotate(2deg); }
      }
      .mascot-sad { animation: mascot-sad-sway 3.2s ease-in-out infinite; transform-origin: 50% 100%; }

      @keyframes mascot-think {
        0%, 100% { transform: rotate(0deg); }
        30% { transform: rotate(-4deg); }
        60% { transform: rotate(3deg); }
      }
      .mascot-thinking { animation: mascot-think 2.4s ease-in-out infinite; transform-origin: 50% 80%; }

      @keyframes mascot-party {
        0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
        25% { transform: translateY(-18px) rotate(-6deg) scale(1.05); }
        50% { transform: translateY(0) rotate(0deg) scale(1); }
        75% { transform: translateY(-18px) rotate(6deg) scale(1.05); }
      }
      .mascot-celebrate { animation: mascot-party 1.1s ease-in-out infinite; transform-origin: 50% 100%; }

      @keyframes tail-wag {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(14deg); }
      }
      .tail-wag { animation: tail-wag 1.8s ease-in-out infinite; transform-origin: 78% 80%; }
      .tail-wag-fast { animation: tail-wag 0.5s ease-in-out infinite; transform-origin: 78% 80%; }

      @keyframes wing-flap {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-18deg); }
      }
      .wing-flap { animation: wing-flap 1.8s ease-in-out infinite; transform-origin: 100% 100%; }
      .wing-flap-fast { animation: wing-flap 0.35s ease-in-out infinite; transform-origin: 100% 100%; }

      @keyframes blink {
        0%, 92%, 100% { transform: scaleY(1); }
        95% { transform: scaleY(0.08); }
      }
      .eye-blink { animation: blink 4.2s infinite; transform-origin: center 55%; }

      @keyframes flame-flicker {
        0%, 100% { transform: scale(1) rotate(-2deg); opacity: 0.95; }
        50% { transform: scale(1.25) rotate(3deg); opacity: 1; }
      }
      .flame-flicker { animation: flame-flicker 0.35s ease-in-out infinite; transform-origin: 20% 50%; }

      @keyframes sparkle-pop {
        0% { transform: scale(0); opacity: 0; }
        50% { transform: scale(1.3); opacity: 1; }
        100% { transform: scale(0.8); opacity: 0; }
      }
      .sparkle { animation: sparkle-pop 1.2s ease-in-out infinite; transform-origin: center; }

      @keyframes tear-drop {
        0% { transform: translateY(0); opacity: 0; }
        30% { opacity: 1; }
        100% { transform: translateY(14px); opacity: 0; }
      }
      .tear { animation: tear-drop 1.6s ease-in infinite; }

      /* ---- UI : animations ---- */
      @keyframes pop-in {
        0% { transform: scale(0.6); opacity: 0; }
        70% { transform: scale(1.08); }
        100% { transform: scale(1); opacity: 1; }
      }
      .animate-pop-in { animation: pop-in 0.35s cubic-bezier(.34,1.56,.64,1) forwards; }

      @keyframes slide-up-banner {
        0% { transform: translateY(100%); }
        100% { transform: translateY(0); }
      }
      .animate-slide-up { animation: slide-up-banner 0.3s ease-out forwards; }

      @keyframes shake-x {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-7px); }
        40%, 80% { transform: translateX(7px); }
      }
      .animate-shake { animation: shake-x 0.45s ease-in-out; }

      @keyframes node-pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(88, 204, 2, 0.45); }
        50% { box-shadow: 0 0 0 14px rgba(88, 204, 2, 0); }
      }
      .node-pulse { animation: node-pulse 1.6s ease-out infinite; }

      @keyframes confetti-fall {
        0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
        100% { transform: translateY(105vh) rotate(720deg); opacity: 0.7; }
      }
      .confetti-piece {
        position: fixed;
        top: -10vh;
        width: 10px;
        height: 16px;
        border-radius: 2px;
        animation: confetti-fall linear forwards;
        z-index: 60;
        pointer-events: none;
      }

      @keyframes bubble-in {
        0% { transform: scale(0.5) translateY(8px); opacity: 0; }
        100% { transform: scale(1) translateY(0); opacity: 1; }
      }
      .animate-bubble-in { animation: bubble-in 0.4s cubic-bezier(.34,1.56,.64,1) forwards; }

      @keyframes xp-count {
        0% { transform: scale(0.4); opacity: 0; }
        60% { transform: scale(1.25); }
        100% { transform: scale(1); opacity: 1; }
      }
      .animate-xp { animation: xp-count 0.6s cubic-bezier(.34,1.56,.64,1) forwards; }

      .progress-bar-fill { transition: width 0.45s cubic-bezier(.4,0,.2,1); }

      /* Boutons style Duolingo (relief 3D) */
      .btn-3d { box-shadow: 0 4px 0 0 var(--btn-shadow, #46a302); transition: all 0.1s ease; }
      .btn-3d:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 0 var(--btn-shadow, #46a302); }
    </style>
    <script>
      tailwind.config = {

              },

              },
              background: {
                DEFAULT: '#f7f7f7',
                light: '#ffffff'
              },
              success: '#58cc02',
              warning: '#ffc800',
              danger: '#ff4b4b',
            }
          }
        }
      }
    </script>
